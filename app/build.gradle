plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    // Unlocks the external open-source library database paths natively
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Automatically injects the missing low-level C++ camera hardware binary libraries
    implementation 'com.github.saki4510t:UVCCamera:v2.3.4'
}
